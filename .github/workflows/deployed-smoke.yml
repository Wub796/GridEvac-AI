name: Deployed smoke test

# Production drift is invisible to the other workflows: they test the code in
# the repository, while a stale Vercel environment variable or an API origin
# that stops answering only shows up on the live site, where the board quietly
# solves routes in the browser instead. This checks the deployment itself.
on:
  schedule:
    - cron: '17 13 * * *' # 13:17 UTC, before the Houston workday
  # Vercel reports every deploy as a GitHub deployment, so a green smoke test
  # lands minutes after production ships instead of at the next daily run.
  deployment_status:
  workflow_dispatch:

jobs:
  deployed:
    name: Deployed board reaches the API
    # Only a successful production deploy; preview deploys are protected and
    # the board deploy already covers the API it talks to.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production') &&
      !contains(github.event.deployment.environment, 'api'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Against the live deployment: no build, no local server.
      - run: npm run test:deployed
