name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API and data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt httpx
      - name: Vercel API mirror matches backend
        run: python tools/sync_api_mirror.py --check
      - name: Endpoint smoke test
        run: python scripts/api_smoke_test.py --inprocess

  web:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
